name: Apply Migration Yield Fix

on:
  push:
    branches:
      - feat/batched-storage-migration-minimal
    paths:
      - .github/workflows/apply-migration-yield-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/batched-storage-migration-minimal
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_migration_yield_fix.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/maintenance/migrateSavedMessagesToChannel.ts
          git commit -m "fix(migration): release lease when upload interrupts forward"
          git push origin HEAD:feat/batched-storage-migration-minimal
