name: Apply Upload Sender Fix

on:
  push:
    branches:
      - feat/batched-storage-migration-minimal
    paths:
      - .github/workflows/apply-upload-sender-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/batched-storage-migration-minimal
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_upload_sender_fix.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/gramjs.ts
          git commit -m "fix(upload): reuse main sender for home-dc file parts"
          git push origin HEAD:feat/batched-storage-migration-minimal
