name: Task 11 Isolated Playwright

on:
  push:
    branches:
      - plan/shared-channel-storage
    paths:
      - .github/workflows/task11-playwright.yml
      - frontend/tests/isolated/stream-location-bridge.spec.ts
      - frontend/src/lib/mainWindowStreamBridge.ts
      - frontend/src/main.tsx
      - frontend/src/service-worker/index.ts
      - frontend/src/components/ChonkyDrive.tsx
      - frontend/src/lib/gramjs.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Task 11 isolated test
        run: npx playwright test --project=isolated tests/isolated/stream-location-bridge.spec.ts
