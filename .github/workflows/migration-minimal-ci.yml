name: Migration Minimal CI

on:
  push:
    branches:
      - feat/batched-storage-migration-minimal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-isolation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run migration upload-isolation regression
        working-directory: frontend
        run: npx vitest run src/maintenance/migrateSavedMessagesToChannel.uploadIsolation.test.ts
