name: Apply Task 15 Database Integration

on:
  push:
    branches:
      - plan/shared-channel-storage
    paths:
      - .github/workflows/apply-task15-database.yml
      - .github/scripts/apply_task15_database_facade.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task15-database-integration
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Database facade
        run: |
          python .github/scripts/apply_task15_database_facade.py
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt pytest >/dev/null
      - name: Focused migration tests
        working-directory: backend
        run: python -m pytest tests/test_storage_migration.py tests/test_linked_accounts.py tests/test_api_authz.py -q
      - name: Commit Database integration
        run: |
          git config user.name 'ChatGPT'
          git config user.email '79632318+yoyotsao@users.noreply.github.com'
          git add backend/app/services/database.py backend/tests/test_storage_migration.py
          git commit -m 'feat: wire storage migration journal into database'
          git push origin HEAD:plan/shared-channel-storage
