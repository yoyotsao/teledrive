<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tele - File Browser</title>
    <!-- PWA: installable on phones. The existing /sw.js (media streaming) already
         satisfies the service-worker install criterion, so only a manifest + icons
         are needed. theme-color follows the app chrome (--td-surface) per scheme. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TeleDrive" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Classic (non-module) script — guaranteed to run before any ES module, including
         node_modules/telegram's TL-schema builder which calls the bare `Buffer.isBuffer(...)`
         at module-evaluation time. vite-plugin-node-polyfills reliably polyfills Buffer in
         `vite dev` (esbuild pre-bundling) but NOT in the `vite build` production bundle, where
         this deeply-nested CommonJS reference is left unpatched, crashing the whole app with
         "Cannot read properties of undefined (reading 'isBuffer')" before React ever renders.
         Regenerate via `node scripts/build-buffer-polyfill.mjs` if the `buffer` dependency changes. -->
    <script src="/buffer-polyfill.js"></script>
    <!-- Both run synchronously before any ES module. Separate files, not inline
         blocks: the production CSP is `script-src 'self'` (security-headers.conf),
         which refuses inline scripts — and the WebSocket patch below is what keeps
         MTProto reachable over HTTPS at all. -->
    <script src="/gramjs-alert-filter.js"></script>
    <!-- On HTTPS, browsers block ws:// (mixed content). Maps Telegram DC IPs to their
         official wss:// domain endpoints (pluto/venus/aurora/vesta/flora.web.telegram.org)
         so the browser connects directly to Telegram with valid TLS — no backend proxy. -->
    <script src="/telegram-wss-patch.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
