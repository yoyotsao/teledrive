services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Keep SQLite off the ./backend bind mount — see DB_PATH in
      # app/services/database.py for why that combination breaks.
      TELEDRIVE_DB_PATH: /data/teledrive.db
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
    volumes:
      - ./backend:/app
      - /app/venv
      - teledrive-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_TELEGRAM_API_ID: ${VITE_TELEGRAM_API_ID}
        VITE_TELEGRAM_API_HASH: ${VITE_TELEGRAM_API_HASH}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # The Cloudflare connector serving the public hostname. It shares the
  # frontend container's network namespace instead of joining the compose
  # network: a token tunnel keeps its ingress rules in the Cloudflare
  # dashboard, not in this repo, so sharing the namespace lets the existing
  # `http://localhost:3000` ingress reach nginx with no dashboard change.
  # Consequences of network_mode: this service publishes no ports of its own
  # and cannot resolve sibling services by name — it needs neither.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    network_mode: "service:frontend"
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  teledrive-data:
