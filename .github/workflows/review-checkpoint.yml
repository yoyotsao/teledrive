name: Review Checkpoint

on:
  push:
    branches:
      - plan/shared-channel-storage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-checkpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-task-1-5:
    name: Backend Task 1-5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Task 1-5 backend tests
        run: >-
          python -m pytest
          tests/test_schema_migration.py
          tests/test_linked_accounts.py
          tests/test_api_accounts.py
          tests/test_api_authz.py
          tests/test_api_files_register.py
          tests/test_telegram_operations.py
          tests/test_shared_storage_review.py
          tests/test_shared_storage_review_purge.py
          tests/test_shared_storage_review_task5.py
          -q

  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
