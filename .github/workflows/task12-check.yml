name: Task 12 Integration Gate

on:
  push:
    branches:
      - plan/shared-channel-storage
    paths:
      - .github/workflows/task12-check.yml
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Focused Task 12 tests
        working-directory: frontend
        run: npm run test:unit -- src/lib/uploadOperations.test.ts src/lib/uploadOperationsPrepared.test.ts src/lib/splitUploadTarget.test.ts src/lib/gramjsTargetAware.test.ts
      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Full frontend suite
        working-directory: frontend
        run: npm run test:unit
