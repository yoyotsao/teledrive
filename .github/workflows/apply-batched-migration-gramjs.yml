name: Apply Batched Migration GramJS Patch

on:
  push:
    branches:
      - feat/batched-storage-migration
    paths:
      - .github/workflows/apply-batched-migration-gramjs.yml
      - .github/scripts/apply_batched_migration_gramjs.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/batched-storage-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply patch
        run: python .github/scripts/apply_batched_migration_gramjs.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Batch forward tests
        working-directory: frontend
        run: >-
          npx vitest run
          src/lib/forwardResult.test.ts
          src/lib/gramjs.forwardBatch.test.ts
          src/lib/gramjsTargetAware.test.ts
          src/maintenance/migrateSavedMessagesToChannel.test.ts
          src/maintenance/migrateSavedMessagesToChannel.photo.test.ts
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/gramjs.ts
          git diff --cached --check
          git commit -m "feat: batch Telegram forwards"
          git push origin HEAD:feat/batched-storage-migration
