limit_req_zone $binary_remote_addr zone=auth_challenge:10m rate=10r/m;

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/conf.d/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # Only JSON metadata reaches this server. Telegram file bytes move directly
    # between GramJS in the browser and Telegram's CDN.
    client_max_body_size 1m;

    location ~ ^/api/v1/(auth|accounts)/challenge$ {
        limit_req zone=auth_challenge burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Backend metadata/auth API.
    location /api/v1 {
        client_max_body_size 1m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Service worker must always be revalidated so updates take effect
    location = /sw.js {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets — safe to cache forever
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /game {
        return 308 /game/;
    }

    # ReinaManager. reina-server routes include the /game prefix, so
    # proxy_pass must not rewrite the URI. Own add_header set replaces inherited ones,
    # so the full Reina header set is included (Reina-only CSP).
    location /game/ {
        include /etc/nginx/snippets/reina-security-headers.conf;
        client_max_body_size 10m;

        # Variable upstream + Docker DNS: nginx starts even when the
        # reinamanager service is absent/unhealthy, so /game outages never
        # take down the public TeleDrive site. No URI part on proxy_pass, so
        # the original request URI (with /game prefix) is forwarded as-is.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $reina_upstream http://reinamanager:8787;
        proxy_pass $reina_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
