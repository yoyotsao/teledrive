services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend:/app
      - /app/venv
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_TELEGRAM_API_ID: ${VITE_TELEGRAM_API_ID}
        VITE_TELEGRAM_API_HASH: ${VITE_TELEGRAM_API_HASH}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
