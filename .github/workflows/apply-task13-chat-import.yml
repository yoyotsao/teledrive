name: Apply Task 13 Chat Import

on:
  push:
    branches:
      - plan/shared-channel-storage
    paths:
      - .github/workflows/apply-task13-chat-import.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task13-chat-import
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply durable chat import patch
        run: |
          python .github/scripts/apply_task13_chat_import.py
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Focused chat import tests
        working-directory: frontend
        run: npm run test:unit -- src/lib/chatImport.test.ts src/lib/chatImportOperation.test.ts
      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Full frontend unit suite
        working-directory: frontend
        run: npm run test:unit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Backend auth regression
        working-directory: backend
        run: |
          pip install -r requirements.txt pytest pytest-asyncio >/dev/null
          python -m pytest tests/test_api_authz.py -q
      - name: Commit Task 13
        run: |
          git config user.name 'ChatGPT'
          git config user.email '79632318+yoyotsao@users.noreply.github.com'
          git add frontend/src/lib/chatImport.ts frontend/src/lib/chatImportDeps.ts frontend/src/lib/chatImportOperation.ts frontend/src/lib/chatImportOperation.test.ts frontend/src/components/ImportChatDialog.tsx
          git commit -m 'feat: import chats through durable storage targets'
          git push origin HEAD:plan/shared-channel-storage
