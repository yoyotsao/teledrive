name: Normalize GramJS CRLF

on:
  push:
    branches:
      - feat/batched-storage-migration-minimal
    paths:
      - .github/workflows/normalize-gramjs-crlf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/batched-storage-migration-minimal
          fetch-depth: 0
      - name: Restore CRLF
        run: python -c "from pathlib import Path; p=Path('frontend/src/lib/gramjs.ts'); b=p.read_bytes().replace(b'\r\n', b'\n'); p.write_bytes(b.replace(b'\n', b'\r\n'))"
      - name: Commit normalization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/gramjs.ts
          git commit -m "chore: preserve gramjs line endings"
          git push origin HEAD:feat/batched-storage-migration-minimal
