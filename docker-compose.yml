services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Keep SQLite off the ./backend bind mount — see DB_PATH in
      # app/services/database.py for why that combination breaks.
      - TELEDRIVE_DB_PATH=/data/teledrive.db
    volumes:
      - ./backend:/app
      - /app/venv
      - teledrive-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_TELEGRAM_API_ID: ${VITE_TELEGRAM_API_ID}
        VITE_TELEGRAM_API_HASH: ${VITE_TELEGRAM_API_HASH}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  teledrive-data:
