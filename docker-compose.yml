services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Keep SQLite off the ./backend bind mount — see DB_PATH in
      # app/services/database.py for why that combination breaks.
      TELEDRIVE_DB_PATH: /data/teledrive.db
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
    volumes:
      - ./backend:/app
      - /app/venv
      - teledrive-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_TELEGRAM_API_ID: ${VITE_TELEGRAM_API_ID}
        VITE_TELEGRAM_API_HASH: ${VITE_TELEGRAM_API_HASH}
        VITE_ENABLE_STORAGE_MIGRATION: ${VITE_ENABLE_STORAGE_MIGRATION:-false}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ReinaManager web app, proxied by frontend nginx under /game/. Publishes
  # no host port: only reachable on the compose network.
  reinamanager:
    image: reinamanager:local
    pull_policy: never  # local-only image; never try docker.io
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REINA_MAX_USERS: ${REINA_MAX_USERS:-100}
      TELEDRIVE_API: http://backend:8000
      REINA_GAME_FOLDER: game
      TZ: Asia/Taipei
    volumes:
      - reina-data:/data
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/game/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # The Cloudflare connector serving the public hostname. It shares the
  # frontend container's network namespace instead of joining the compose
  # network: a token tunnel keeps its ingress rules in the Cloudflare
  # dashboard, not in this repo, so sharing the namespace lets the existing
  # `http://localhost:3000` ingress reach nginx with no dashboard change.
  # Consequences of network_mode: this service publishes no ports of its own
  # and cannot resolve sibling services by name — it needs neither.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    network_mode: "service:frontend"
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  teledrive-data:
  reina-data:
