name: Shared Channel Storage Repair

on:
  push:
    branches:
      - plan/shared-channel-storage-repair

permissions:
  contents: read

jobs:
  backend-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt pytest >/dev/null
      - name: Run shared-channel backend suite
        working-directory: backend
        run: >-
          python -m pytest
          tests/test_schema_migration.py
          tests/test_linked_accounts.py
          tests/test_api_accounts.py
          tests/test_api_files_register.py
          tests/test_api_authz.py
          tests/test_telegram_operations.py
          tests/test_storage_migration.py
          tests/test_storage_migration_partial_rollback.py
          -q

  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run shared-channel frontend unit suite
        working-directory: frontend
        run: >-
          npx vitest run
          src/lib/telegramMedia.test.ts
          src/lib/chatImport.test.ts
          src/lib/forwardResult.test.ts
          src/lib/storageLocation.test.ts
          src/lib/telegramOperationRecovery.test.ts
          src/lib/channelStorage.test.ts
          src/lib/channelStorage.peer-cache.test.ts
          src/lib/fileLocationResolver.test.ts
          src/lib/fileLocationResolver.peer-cache.test.ts
          src/lib/uploadOperations.test.ts
          src/lib/mainWindowStreamBridge.legacy.test.ts
          src/maintenance/migrateSavedMessagesToChannel.photo.test.ts

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  isolated-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run shared-channel isolated browser suite
        working-directory: frontend
        env:
          VITE_ENABLE_STORAGE_MIGRATION: 'true'
        run: >-
          npx playwright test --project=isolated
          tests/isolated/storage-target-settings.spec.ts
          tests/isolated/stream-location-bridge.spec.ts
          tests/isolated/storage-migration.spec.ts
